
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200

# Flags untuk mengaktifkan PSRAM (wajib untuk ESP32-CAM) dan menambahkan folder models ke search path
build_flags = 
    -I models
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

# Dependensi Pustaka otomatis
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
    https://github.com/tanakamasayuki/Arduino_TensorFlowLite_ESP32.git
    mobizt/Firebase ESP32 Client @ ^4.4.14
